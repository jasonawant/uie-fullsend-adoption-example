# Fullsend-AI Agents latest release.
base: https://raw.githubusercontent.com/fullsend-ai/agents/93c69826f40bd14c8c40dc5797bd7d9ef5a8b748/harness/triage.yaml#sha256=5ada8f85cee204e2fcb8ba6935b301345b3dc56ee3f306d6eafd35f7bc4312a7

trigger: >
  event.source.system == "jira"
    && event.entity.kind == "work_item"
    && "repo:jasonawant/uie-fullsend-adoption-example" in event.state.labels
    && event.state.labels.filter(label, label.startsWith("repo:")).size() == 1
    && (
     (event.transition.kind == "label_changed"
       && event.transition.label.action == "added"
       && event.transition.label.name == "ready-to-triage")
     ||
     (event.transition.kind == "comment_added"
       && has(event.transition.comment.command)
       && event.transition.comment.command == "/fs-triage")
   )

# Disable automatic code-agent handoff during the initial rollout.
env:
  runner:
    TRIAGE_AUTO_CODE: "off"
    TRIAGE_AUTO_CODE_CATEGORIES: ""
  sandbox:
    TRIAGE_AUTO_CODE: "off"
    TRIAGE_AUTO_CODE_CATEGORIES: ""
