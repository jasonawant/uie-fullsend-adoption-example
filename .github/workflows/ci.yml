name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install linters
        run: npm install --global markdownlint-cli@0.45.0 && pip install yamllint==1.37.1
      - name: Lint YAML
        run: yamllint .github/ .fullsend/
      - name: Lint Markdown
        run: markdownlint "**/*.md"
      - name: Test UIE delivery gate
        run: python3 -m unittest discover -s tests
