name: UIE pull request delivery

on:
  pull_request_target:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  actions: write
  contents: write
  id-token: write
  issues: write
  packages: read
  pull-requests: write

jobs:
  route:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.route.outputs.matrix }}
    steps:
      - name: Authorize manual request and resolve Jira correlation
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_URL: ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          LABEL: ${{ github.event.label.name }}
          COMMENT: ${{ github.event.comment.body }}
          ACTOR: ${{ github.event.sender.login }}
          ACTOR_TYPE: ${{ github.event.sender.type }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEWER: ${{ github.event.review.user.login }}
          FULLSEND_APP_SET: ${{ vars.FULLSEND_APP_SET }}
        run: |
          set -euo pipefail
          stage=""
          manual=false
          case "${EVENT_NAME}" in
            pull_request_target)
              if [[ "${EVENT_ACTION}" == "labeled" && "${LABEL}" == "ready-for-review" ]]; then
                stage=review
                manual=true
              fi
              ;;
            issue_comment)
              [[ "${IS_PR_COMMENT}" == true ]] || exit 0
              command=$(printf '%s\n' "${COMMENT}" | head -1 | tr -d '\r' | awk '{print $1}')
              if [[ "${command}" == "/fs-review" && "$(printf '%s\n' "${COMMENT}" | head -1 | tr -d '\r')" == "/fs-review" ]]; then
                stage=review
                manual=true
              elif [[ "${command}" == "/fs-fix" ]]; then
                stage=fix
                manual=true
              fi
              ;;
            pull_request_review)
              review_bot="${REPOSITORY%%/*}-review[bot]"
              custom_review_bot=""
              [[ -n "${FULLSEND_APP_SET}" ]] && custom_review_bot="${FULLSEND_APP_SET}-review[bot]"
              if [[ "${EVENT_ACTION}" == "submitted" && "${REVIEW_STATE}" == "changes_requested" \
                && ("${REVIEWER}" == "fullsend-ai-review[bot]" || "${REVIEWER}" == "${review_bot}" || "${REVIEWER}" == "${custom_review_bot}") ]]; then
                stage=fix
              fi
              ;;
          esac
          [[ -n "${stage}" ]] || exit 0
          if [[ -z "${PR_SHA}" || "${PR_URL}" != *"/pull/"* ]]; then
            pr_json=$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json url,headRefOid)
            PR_URL=$(jq -r '.url' <<<"${pr_json}")
            PR_SHA=$(jq -r '.headRefOid' <<<"${pr_json}")
          fi
          if [[ "${manual}" == true ]]; then
            [[ "${ACTOR_TYPE}" != "Bot" ]] || exit 0
            role=$(gh api "repos/${REPOSITORY}/collaborators/${ACTOR}/permission" --jq '.role_name')
            case "${role}" in admin|maintain|write) ;; *) exit 0 ;; esac
          else
            labels=$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json labels --jq '[.labels[].name] | join("\n")')
            [[ "${labels}" != *"fullsend-no-fix"* ]] || exit 0
          fi
          jira_issue=$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
            | sed -nE 's/.*<!-- fullsend-uie:jira=([A-Z][A-Z0-9]*-[0-9]+) -->.*/\1/p' | tail -1)
          [[ -n "${jira_issue}" ]] || { echo "::notice::No UIE Jira correlation marker on PR #${PR_NUMBER}"; exit 0; }
          event=$(jq -cn --argjson n "${PR_NUMBER}" --arg url "${PR_URL}" --arg sha "${PR_SHA}" '{issue:null, pull_request:{number:$n,html_url:$url,head:{sha:$sha}}, _normalized_event:{source:{system:"github"},entity:{key:($n|tostring)}}}')
          role=review
          [[ "${stage}" == fix ]] && role=coder
          matrix=$(jq -cn --arg agent "${stage}" --arg role "${role}" --arg repo "${REPOSITORY}" --arg payload "${event}" --arg number "${PR_NUMBER}" --arg jira "${jira_issue}" '{include:[{agent:$agent,role:$role,source_repo:$repo,event_type:"github",event_payload:$payload,status_repo:$repo,status_number:$number,jira_issue_key:$jira}]}')
          delim="MATRIX_$(openssl rand -hex 8)"
          {
            echo "matrix<<${delim}"
            echo "${matrix}"
            echo "${delim}"
          } >> "${GITHUB_OUTPUT}"

  dispatch:
    needs: route
    if: needs.route.outputs.matrix != ''
    uses: ./.github/workflows/uie-dispatch.yml
    with:
      matrix: ${{ needs.route.outputs.matrix }}
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      fullsend_version: v0.45.0
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      FULLSEND_OPENAI_API_KEY: ${{ secrets.FULLSEND_OPENAI_API_KEY }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
